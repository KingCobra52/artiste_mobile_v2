name: pipelines

# Collects the daily snapshots. These APIs only report current totals, so a
# missed day cannot be backfilled later - you cannot ask for yesterday's
# playcount today. That is why this runs more than once a day.

on:
  schedule:
    # Three attempts a day, so any one can be delayed or fail without losing
    # the day. GitHub cron is best effort. Off-the-hour minutes on purpose:
    # everything scheduled at :00 queues together, and that is where runs get
    # dropped. Times are UTC.
    - cron: "23 7 * * *"
    - cron: "23 13 * * *"
    - cron: "23 19 * * *"
  workflow_dispatch:

concurrency:
  # No cancel-in-progress. A slow run and the next scheduled one must not
  # interleave writes.
  group: pipelines
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # There is no global timeout in the code. With every request timing out the
    # run is roughly 25 minutes, so this cuts off a hung run without cutting off
    # a slow but healthy one.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # From the repo root. There are no __init__.py files, so the
      # `from pipelines.x import` style only resolves with the root on sys.path.
      - name: Run pipelines
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: python -m pipelines.pipeline

      # The alert that matters. A failed run already emails; a run that never
      # happens does not. This ping is what makes silence visible, and silence
      # is what put the three week hole in the data.
      - name: Report success to the dead-man's switch
        if: success()
        run: curl -fsS -m 10 --retry 3 "${{ secrets.HEALTHCHECK_URL }}"
